# Netlify hosts only the static design page. The FastAPI service in app/
# is a long-running server and needs a container host (Render, Railway,
# Fly.io, AWS ECS), not Netlify.
[build]
  base = "/"
  publish = "docs"
  command = "echo 'Static site, no build step'"

[build.environment]
  # Stop Netlify from trying to install requirements.txt for a static site.
  PYTHON_VERSION = "3.12"
