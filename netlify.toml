# Netlify hosts the interactive prototype (docs/) and a small API
# (netlify/functions/db.mjs) that stores the prototype's tables in Postgres.
# The FastAPI service in app/ is a long-running server; host it on
# Render / Railway / Fly.io / ECS instead.
[build]
  publish = "docs"
  command = "echo 'Static site + functions, no build step'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"
  PYTHON_VERSION = "3.12"
